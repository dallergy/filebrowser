version: 2

project_name: filebrowser

env:
  - GO111MODULE=on

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/filebrowser/filebrowser/v2/version.Version={{ .Version }} -X github.com/filebrowser/filebrowser/v2/version.CommitSHA={{ .ShortCommit }}
    main: main.go
    binary: filebrowser
    goos:
      - darwin
      - linux
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
      - riscv64
    goarm:
      - "5"
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: "386"
      # Experimental, may not work properly
      - goos: openbsd
        goarch: riscv64
      # Broken as of Go 1.24, deprecated as of Go 1.26
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm

archives:
  - name_template: "{{.Os}}-{{.Arch}}{{if .Arm}}v{{.Arm}}{{end}}-{{ .ProjectName }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]

# Images are published to every registry named by GHCR_IMAGE and
# DOCKERHUB_IMAGE (e.g. ghcr.io/owner/filebrowser, owner/filebrowser); an
# unset variable is simply left out.
dockers_v2:
  - id: alpine
    dockerfile: Dockerfile
    images:
      - '{{ envOrDefault "GHCR_IMAGE" "" }}'
      - '{{ envOrDefault "DOCKERHUB_IMAGE" "" }}'
    tags:
      - "{{ .Tag }}"
      - "{{ .Version }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "v{{ .Major }}"
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.licenses: Apache-2.0
    extra_files:
      - docker

  - id: s6
    dockerfile: Dockerfile.s6
    images:
      - '{{ envOrDefault "GHCR_IMAGE" "" }}'
      - '{{ envOrDefault "DOCKERHUB_IMAGE" "" }}'
    tags:
      - "{{ .Tag }}-s6"
      - "{{ .Version }}-s6"
      - "v{{ .Major }}-s6"
      - '{{ if not .Prerelease }}s6{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.licenses: Apache-2.0
    extra_files:
      - docker

changelog:
  use: github-native
