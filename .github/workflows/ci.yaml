name: Continuous Integration

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 2.64.0). Tags the selected commit and publishes the release and Docker images."
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          pnpm run test

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: "latest"

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.27.x"
          go-package: ./...

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The minimum version from go.mod and the current release.
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: go test --race ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - name: Install Task
        uses: go-task/setup-task@v2
      # Static, like the release binaries: the image has no C library to link against.
      - run: task build
        env:
          CGO_ENABLED: "0"
      - name: Build Docker image
        run: |
          ctx="$(mktemp -d)"
          mkdir -p "$ctx/linux/amd64"
          cp filebrowser "$ctx/linux/amd64/"
          cp -r Dockerfile docker "$ctx/"
          docker build --platform linux/amd64 -t filebrowser:ci "$ctx"
      - name: Smoke test Docker image
        run: |
          docker run -d --name filebrowser -p 8080:80 filebrowser:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="app">'
      - name: Container logs
        if: always()
        run: docker logs filebrowser || true

  release:
    name: Release
    needs: ["lint-frontend", "test-frontend", "lint-backend", "test", "build"]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME || vars.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like 2.64.0, got '$VERSION'"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Install Task
        uses: go-task/setup-task@v2
      - run: task build:frontend
      # Images always go to the GitHub Container Registry of this repository,
      # and to Docker Hub as well when DOCKER_USERNAME (a secret or a variable)
      # and the DOCKER_PASSWORD secret are set. The Docker Hub repository defaults to
      # <DOCKER_USERNAME>/filebrowser and can be changed with the
      # DOCKERHUB_IMAGE repository variable.
      - name: Choose image names
        env:
          DOCKERHUB_IMAGE_OVERRIDE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "DOCKERHUB_IMAGE=${DOCKERHUB_IMAGE_OVERRIDE:-docker.io/$DOCKERHUB_USERNAME/filebrowser}" >> "$GITHUB_ENV"
          fi
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
